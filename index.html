<style>
:root {
  --bg: #e8e1d0;
  --surface: #f6f1e4;
  --ink: #26221a;
  --ink-2: #5f5646;
  --ink-3: #897f6c;
  --line: #d5ccb6;
  --line-strong: #bbb097;
  --accent: #d93526;
  --accent-ink: #ffffff;
  --hover: #fffcf3;
  --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #151b20;
  --surface: #202931;
  --ink: #f1f4f7;
  --ink-2: #a6b2bd;
  --ink-3: #7b8995;
  --line: #2c3842;
  --line-strong: #425160;
  --accent: #ff5a47;
  --accent-ink: #1a0d0b;
  --hover: #2a3641;
}
/* Results are raised cards in both themes */
.day-head { margin-bottom: 10px; }
main .game {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 6px;
  box-shadow: inset 4px 0 0 var(--s, var(--line-strong)), 0 1px 3px rgba(60,45,20,.12), 0 2px 8px rgba(60,45,20,.06);
}
.schedule .game:hover { background: var(--hover); border-color: var(--line-strong); }
:root[data-theme="dark"] .day-head { border-bottom-color: var(--line-strong); }
:root[data-theme="dark"] main .game { box-shadow: inset 4px 0 0 var(--s, var(--line-strong)), 0 2px 6px rgba(0,0,0,.3); }
:root[data-theme="dark"] .time b { color: #fff; }
:root[data-theme="dark"] .matchup { color: #fff; }
:root[data-theme="dark"] .net { background: rgba(255,255,255,.05); border-color: var(--line-strong); }
:root[data-theme="dark"] .field { background: var(--surface); }
:root[data-theme="dark"] .detail { background: rgba(10,14,18,.7); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }

body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 920px; margin: 0 auto; padding: 0 24px; }

/* ---------- Top bar ---------- */
.topbar { border-bottom: 1px solid var(--line); }
.topbar .wrap {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; height: 60px;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-stretch: 85%; font-size: 1.25rem; letter-spacing: -0.01em;
  text-transform: uppercase;
}
.brand-mark {
  width: 26px; height: 26px; border-radius: 6px; background: var(--accent);
  display: grid; place-items: center;
}
.brand-mark svg { width: 14px; height: 14px; fill: var(--accent-ink); }
.brand em { font-style: normal; color: var(--accent); }

.top-actions { display: flex; align-items: center; gap: 8px; }
.ctl {
  height: 34px; padding: 0 12px;
  background: transparent; border: 1px solid var(--line-strong); border-radius: 6px;
  font-size: 0.85rem; font-weight: 600;
  transition: border-color .15s, background .15s;
}
.ctl:hover { border-color: var(--ink-2); }
select.ctl { padding-right: 6px; }
.theme-btn { width: 34px; padding: 0; display: grid; place-items: center; }
.theme-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Intro ---------- */
.intro { padding: 44px 0 24px; }
.intro .kicker {
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 10px;
}
.intro h1 {
  font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 800; font-stretch: 80%;
  line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase;
}
.intro p { color: var(--ink-2); margin-top: 14px; max-width: 46ch; }

/* ---------- Filters ---------- */
.filters {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 12px 0;
}
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.field {
  height: 38px; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 6px;
  padding: 0 12px; font-size: 0.9rem;
}
.field::placeholder { color: var(--ink-3); }
.field:hover { border-color: var(--ink-2); }
.search { flex: 1 1 200px; min-width: 0; }
.chips {
  display: flex; gap: 6px; margin-top: 10px;
  overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 30px; padding: 0 12px;
  background: transparent; border: 1px solid var(--line-strong); border-radius: 999px;
  font-size: 0.8rem; font-weight: 600; color: var(--ink-2);
  transition: all .15s;
}
.chip:hover { color: var(--ink); border-color: var(--ink-2); }
.chip.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.clear {
  background: none; border: none; color: var(--ink-2); font-size: 0.85rem; font-weight: 600;
  text-decoration: underline; text-underline-offset: 3px; padding: 0 6px; height: 38px;
}
.clear:hover { color: var(--accent); }

/* ---------- Schedule ---------- */
.schedule { padding: 8px 0 80px; }
.day { margin-top: 36px; }
.day-head {
  display: flex; align-items: baseline; gap: 12px;
  padding-bottom: 10px; border-bottom: 2px solid var(--ink);
}
.day-name {
  font-size: 1.6rem; font-weight: 800; font-stretch: 82%;
  text-transform: uppercase; letter-spacing: -0.01em;
}
.day-date { color: var(--ink-2); font-weight: 600; font-size: 0.95rem; }
.day-count { margin-left: auto; color: var(--ink-3); font-size: 0.8rem; font-weight: 600; }
.today-tag {
  font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  background: var(--accent); color: var(--accent-ink); padding: 2px 7px; border-radius: 3px;
  align-self: center;
}

.game {
  display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; align-items: center;
  width: 100%; text-align: left; background: none; border: none;
  border-bottom: 1px solid var(--line);
  padding: 14px 8px; margin: 0;
  transition: background .12s;
}
.game:hover { background: var(--hover); }
/* Sport colors: bar on the row, label text, chip dot */
.s-nfl { --s: #2f6fdb; }
.s-nba { --s: #e8731a; }
.s-nhl { --s: #0e9aa7; }
.s-ncaaf { --s: #2e9e55; }
.s-ufc { --s: #d6342c; }
.s-motorsports { --s: #b8890b; }

:root[data-theme="dark"] .s-nba { --s: #ff9a4d; }
:root[data-theme="dark"] .s-nhl { --s: #3ccbd8; }
:root[data-theme="dark"] .s-ncaaf { --s: #52c97c; }
:root[data-theme="dark"] .s-ufc { --s: #ff6b60; }
:root[data-theme="dark"] .s-motorsports { --s: #e8b830; }

.game .sport, .detail .sport { color: var(--s, var(--ink-3)); }
.chip::before {
  content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--s, var(--ink-3)); margin-right: 7px; vertical-align: 1px;
}
.chip.active::before { box-shadow: 0 0 0 1.5px var(--bg); }
.time { font-variant-numeric: tabular-nums; line-height: 1.15; }
.time b { font-size: 1.05rem; font-weight: 700; display: block; }
.time small { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-3); }
.sport {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 2px;
}
.matchup { font-weight: 600; font-size: 1.02rem; line-height: 1.3; }
.live {
  display: inline-flex; align-items: center; gap: 5px; margin-left: 10px;
  font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent); vertical-align: 2px;
}
.live::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  animation: blink 1.4s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: 0.25; } }

.net {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 0.82rem; font-weight: 700; white-space: nowrap;
  padding: 5px 10px 5px 8px; border: 1px solid var(--line-strong); border-radius: 5px;
}
.net::before {
  content: ''; width: 9px; height: 9px; border-radius: 2px; background: var(--c, var(--ink-3));
}

.empty, .loading {
  text-align: center; color: var(--ink-2); padding: 80px 0;
}
.empty strong { display: block; color: var(--ink); font-size: 1.2rem; margin-bottom: 4px; }
.error { color: var(--accent); }

/* Network colors */
.n-espn, .n-espnplus, .n-espnu { --c: #d00; }
.n-netflix { --c: #e50914; }
.n-abc { --c: #2a6ff0; }
.n-fox { --c: #1b5fc1; }
.n-cbs { --c: #1a6cd9; }
.n-nbc { --c: #f59e0b; }
.n-peacock { --c: #8b5cf6; }
.n-paramount { --c: #2b7fff; }
.n-primevideo { --c: #00a8e1; }
.n-tnt { --c: #777; }
.n-cwnetwork { --c: #1aa84a; }
.n-nflnet { --c: #1f4788; }
.n-fs1, .n-fs2 { --c: #0a6cc4; }
.n-usanetwork { --c: #2563eb; }
.n-thespot, .n-wxpx { --c: #ff6b42; }
.n-raystv { --c: #092c5c; }
.n-nhln { --c: #003087; }

/* ---------- Detail ---------- */
.detail {
  position: fixed; inset: 0; z-index: 100; display: none;
  background: rgba(10,10,8,.55); overflow-y: auto;
  animation: fade .15s ease;
}
.detail.open { display: block; }
.detail-card {
  max-width: 640px; margin: 8vh auto; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 10px; padding: 28px;
  animation: rise .2s ease;
}
.detail-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.detail-close {
  background: none; border: 1px solid var(--line-strong); border-radius: 6px;
  height: 32px; padding: 0 12px; font-size: 0.82rem; font-weight: 600;
}
.detail-close:hover { border-color: var(--ink-2); }
.detail h2 {
  font-size: 1.9rem; font-weight: 800; font-stretch: 85%; line-height: 1.1;
  letter-spacing: -0.01em; margin-bottom: 12px;
}
.detail-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; color: var(--ink-2); font-weight: 600; margin-bottom: 22px; }
.detail-info {
  border-top: 1px solid var(--line); padding-top: 18px;
  line-height: 1.75; color: var(--ink); overflow-wrap: anywhere;
  max-height: 50vh; overflow-y: auto;
}
.detail-info a { color: var(--accent); text-underline-offset: 3px; }
.detail-info.none { color: var(--ink-3); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

/* ---------- Responsive ---------- */
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .intro { padding-top: 28px; }
  .filters { position: static; }
  .field { font-size: 16px; } /* 16px+ stops iOS zooming on focus */
  .intro h1 { font-size: 2.1rem; }
  .intro { padding-bottom: 16px; }
  .day-name { font-size: 1.4rem; }
  .game { grid-template-columns: 78px 1fr; row-gap: 8px; padding: 14px 12px 14px 18px; }
  .game .net { grid-column: 2; justify-self: start; }
  .field.sel { flex: 1 1 calc(50% - 4px); }
  .top-actions select.ctl { max-width: 118px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

  <div class="wrap">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M1 1h12v3H8.5v9h-3V4H1z"/></svg></span>

    </div>

      <select class="ctl" id="timezoneSelect" aria-label="Timezone" onchange="updateTimezone()">

<div class="wrap">
  <section class="intro">
    <div class="kicker" id="currentDate">&nbsp;</div>
    <h1>What's on<br>tonight</h1>
    <p>Game times and channels for the NFL, NBA, NHL, UFC, college football and more.</p>
  </section>
</div>

<div class="filters">
  <div class="wrap">
    <div class="filter-row">
      <input type="search" class="field search" id="searchBox" placeholder="Search teams or fighters" aria-label="Search" oninput="applyFilters()">
      <select class="field sel" id="dayDropdown" aria-label="Day" onchange="applyFilters()">
        <option value="">All days</option>
      </select>
      <select class="field sel" id="networkDropdown" aria-label="Network" onchange="applyFilters()">
        <option value="">All networks</option>
      </select>
      <button class="clear" onclick="clearAllFilters()">Clear</button>
    </div>
    <div class="chips" id="sportFilters" role="group" aria-label="Sport"></div>
  </div>
</div>

<main class="wrap schedule" id="schedule">
  <div class="loading">Loading schedule…</div>
</main>

<div id="detailView" class="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="detail-card">
    <div class="detail-top">
      <span class="sport" id="detailSport"></span>
      <button class="detail-close" onclick="closeDetailView()">Close ✕</button>
    </div>
    <h2 id="detailTitle"></h2>
    <div class="detail-meta">
      <span id="detailDate"></span>
      <span id="detailTime"></span>
      <span class="net" id="detailNetwork"></span>

    <div id="detailInfo" class="detail-info"></div>

</div>

<script>
let allGames = [];
let visibleGames = [];
let currentTimezone = 'EST';
let filters = { search: '', network: '', sport: '', day: '' };

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const timezoneOffsets = { EST: 0, CST: -1, MST: -2, PST: -3 };
const EST_OFFSET_HOURS = -5;

// GOOGLE SHEET CONFIGURATION (Public Read-Only)
const SHEET_ID = '1gs8pwsOGR7yepLg1bTTthYmZ_NNprgP6-1Znu4ieRXM';
const SHEET_NAME = 'schedule_template';

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const track = (name, params) => { if (typeof gtag !== 'undefined') gtag('event', name, params); };

/* ---------- Theme ---------- */
const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').innerHTML = theme === 'dark' ? ICON_SUN : ICON_MOON;
}
function toggleDarkMode() {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  track('toggle_dark_mode', { enabled: next === 'dark' });
}
(function initTheme() {
  let saved = null;
  try {
    saved = localStorage.getItem('theme');
    if (!saved && localStorage.getItem('darkMode') === 'true') saved = 'dark';
  } catch (e) {}
  const prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
})();

/* ---------- Time ---------- */
function updateTimezone() {
  currentTimezone = document.getElementById('timezoneSelect').value;
  try { localStorage.setItem('selectedTimezone', currentTimezone); } catch (e) {}
  track('change_timezone', { timezone: currentTimezone });
  displaySchedule();
}

function convertTime(timeStr) {
  if (!timeStr) return { t: '', tz: '' };
  try {
    const [time, period] = timeStr.split(' ');
    const [hours, minutes] = time.split(':');
    let hour = parseInt(hours);
    if (period === 'PM' && hour !== 12) hour += 12;
    if (period === 'AM' && hour === 12) hour = 0;
    hour += timezoneOffsets[currentTimezone];
    if (hour < 0) hour += 24;
    if (hour >= 24) hour -= 24;
    const p = hour >= 12 ? 'PM' : 'AM';
    const h = hour === 0 ? 12 : hour > 12 ? hour - 12 : hour;
    return { t: `${h}:${minutes} ${p}`, tz: currentTimezone };
  } catch (e) {
    return { t: timeStr, tz: '' };
  }
}

function timeToMinutes(timeStr) {
  const m = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/);
  if (!m) return 0;
  let h = parseInt(m[1]);
  if (m[3] === 'PM' && h !== 12) h += 12;
  if (m[3] === 'AM' && h === 12) h = 0;
  return h * 60 + parseInt(m[2]);
}

// Game dates come as "Wednesday, December 31" (no year); infer it from today.
function dateParts(dateStr) {
  const parts = dateStr.split(', ');
  const md = (parts[1] || '').split(' ');
  const month = MONTHS.indexOf(md[0]);
  const day = parseInt(md[1]);
  const now = new Date();
  const year = month < now.getMonth() ? now.getFullYear() + 1 : now.getFullYear();
  return { weekday: parts[0], monthName: md[0], month, day, year };
}

function parseGameDate(dateStr, timeStr) {
  try {
    const d = dateParts(dateStr);
    const mins = timeToMinutes(timeStr);
    // EST is UTC-5: add 5 hours to get UTC
    return new Date(Date.UTC(d.year, d.month, d.day, Math.floor(mins / 60) + 5, mins % 60));
  } catch (e) {
    return new Date();
  }
}

function isGameLive(gameDate, sport) {
  const durations = { NCAAF: 240, NFL: 225, NBA: 150, NHL: 150 };
  const end = gameDate.getTime() + (durations[sport] || 180) * 60000;
  const now = Date.now();
  return now >= gameDate.getTime() && now <= end;
}

/* ---------- Data ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (c === '"') {
      if (inQuotes && n === '"') { field += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) {
      row.push(field); field = '';
    } else if ((c === '\n' || c === '\r') && !inQuotes) {
      if (c === '\r' && n === '\n') i++;
      row.push(field);
      if (row.some(f => f.trim())) rows.push(row);
      row = []; field = '';
    } else field += c;
  }
  if (field.length || row.length) {
    row.push(field);
    if (row.some(f => f.trim())) rows.push(row);
  }
  return rows;
}

async function loadScheduleData() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;
    const response = await fetch(url);
    const rows = parseCSV(await response.text());
    if (rows.length > 1) {
      parseGamesFromSheet(rows.slice(1).filter(r => r.length >= 5));
      populateFilterDropdowns();
      displaySchedule();
    } else {
      throw new Error('No data returned');
    }
  } catch (error) {
    console.error('Error:', error);
    track('load_error', { error_message: error.message, error_type: error.name });
    document.getElementById('schedule').innerHTML =
      `<div class="loading error"><strong>Couldn't load the schedule.</strong><br>${esc(error.message)}</div>`;
  }
}

function parseGamesFromSheet(values) {
  allGames = values.map(row => {
    let dateStr = row[0].trim();
    const m = dateStr.match(/^(\w+),\s+(\w+)\s+(\d+)$/);
    if (m) {
      const d = dateParts(dateStr);
      if (d.month !== -1) {
        const actual = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date(d.year, d.month, d.day).getDay()];
        if (actual !== m[1]) dateStr = `${actual}, ${m[2]} ${m[3]}`;
      }
    }
    const extra = row[5] ? row[5].trim() : '';
    return {
      date: dateStr,
      time: row[1].trim(),
      matchup: row[2].trim(),
      network: row[3].trim(),
      sport: row[4].trim(),
      bowlName: extra,
      additionalInfo: extra
    };
  });

  const sortKey = g => {
    const d = dateParts(g.date);
    return Date.UTC(d.year, d.month, d.day) + timeToMinutes(g.time) * 60000;
  };
  allGames.sort((a, b) => sortKey(a) - sortKey(b));

  const nowEST = new Date(Date.now() + EST_OFFSET_HOURS * 3600000);
  const todayEST = Date.UTC(nowEST.getUTCFullYear(), nowEST.getUTCMonth(), nowEST.getUTCDate());
  allGames = allGames.filter(g => {
    try { const d = dateParts(g.date); return Date.UTC(d.year, d.month, d.day) >= todayEST; }
    catch (e) { return true; }
  });
}

/* ---------- Filters ---------- */
function populateFilterDropdowns() {
  const sports = [...new Set(allGames.map(g => g.sport))].sort();
  const days = [...new Set(allGames.map(g => g.date))];

  const box = document.getElementById('sportFilters');
  box.innerHTML = sports.map(s =>
    `<button class="chip ${sportClass(s)}${filters.sport === s ? ' active' : ''}" data-sport="${esc(s)}" aria-pressed="${filters.sport === s}">${esc(s)}</button>`
  ).join('');
  box.onclick = e => {
    const b = e.target.closest('.chip');
    if (b) toggleSportFilter(b.dataset.sport);
  };

  const nd = document.getElementById('networkDropdown');
  const nets = [...new Set(allGames.map(g => g.network))].sort((a, b) => a.localeCompare(b));
  nd.innerHTML = '<option value="">All networks</option>' +
    nets.map(n => `<option value="${esc(n)}"${filters.network === n ? ' selected' : ''}>${esc(n)}</option>`).join('');

  const dd = document.getElementById('dayDropdown');
  dd.innerHTML = '<option value="">All days</option>' +
    days.map(d => `<option value="${esc(d)}"${filters.day === d ? ' selected' : ''}>${esc(d)}</option>`).join('');
}

function toggleSportFilter(sport) {
  filters.sport = filters.sport === sport ? '' : sport;
  document.querySelectorAll('#sportFilters .chip').forEach(b => {
    const on = b.dataset.sport === filters.sport;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on);
  });
  applyFilters();
}

function applyFilters() {
  filters.search = document.getElementById('searchBox').value.toLowerCase();
  filters.network = document.getElementById('networkDropdown').value;
  filters.day = document.getElementById('dayDropdown').value;

  const used = ['search', 'network', 'sport', 'day'].filter(k => filters[k]);
  if (used.length) {
    track('apply_filters', {
      filters_used: used.join(','),
      sport: filters.sport || 'all',
      network: filters.network || 'all'
    });
  }
  displaySchedule();
}

function clearAllFilters() {
  document.getElementById('searchBox').value = '';
  document.getElementById('networkDropdown').value = '';
  document.getElementById('dayDropdown').value = '';
  document.querySelectorAll('.chip.active').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', false); });
  filters = { search: '', network: '', sport: '', day: '' };
  displaySchedule();
}

/* ---------- Render ---------- */
function getChannelClass(network) {
  const key = network.toLowerCase().replace(/\+/g, 'plus').replace(/[^\w]/g, '');
  const map = {
    espn: 'espn', espn2: 'espn', espnu: 'espnu', netflix: 'netflix', espnplus: 'espnplus', abc: 'abc', fox: 'fox', cbs: 'cbs', nbc: 'nbc',
    peacock: 'peacock', paramountplus: 'paramount', paramount: 'paramount',
    primevideo: 'primevideo', prime: 'primevideo', tnt: 'tnt', tbs: 'tnt', cwnetwork: 'cwnetwork', thecw: 'cwnetwork',
    nflnet: 'nflnet', nflnetwork: 'nflnet', fs1: 'fs1', fs2: 'fs2', usanetwork: 'usanetwork',
    nhln: 'nhln', nhlnetwork: 'nhln', thespot: 'thespot', raystv: 'raystv', wxpx: 'wxpx'
  };
  return 'n-' + (map[key] || 'none');
}

const sportClass = s => 's-' + s.toLowerCase().replace(/[^a-z0-9]/g, '');

function displaySchedule() {
  let list = allGames;
  if (filters.search) {
    list = list.filter(g => g.matchup.toLowerCase().includes(filters.search) || g.sport.toLowerCase().includes(filters.search));
  }
  if (filters.network) list = list.filter(g => g.network === filters.network);
  if (filters.sport) list = list.filter(g => g.sport === filters.sport);
  if (filters.day) list = list.filter(g => g.date === filters.day);

  // allGames is already chronological, so grouping preserves order
  const groups = new Map();
  list.forEach(g => {
    if (!groups.has(g.date)) groups.set(g.date, []);
    groups.get(g.date).push(g);
  });

  const nowEST = new Date(Date.now() + EST_OFFSET_HOURS * 3600000);
  const todayKey = Date.UTC(nowEST.getUTCFullYear(), nowEST.getUTCMonth(), nowEST.getUTCDate());

  visibleGames = [];
  let html = '';

  if (!groups.size) {
    html = '<div class="empty"><strong>Nothing matches.</strong>Try clearing a filter, or check back soon.</div>';
  } else {
    groups.forEach((games, date) => {
      const d = dateParts(date);
      const isToday = Date.UTC(d.year, d.month, d.day) === todayKey;
      html += `<section class="day"><div class="day-head">
        <span class="day-name">${esc(d.weekday)}</span>
        <span class="day-date">${esc(d.monthName)} ${d.day}</span>
        ${isToday ? '<span class="today-tag">Today</span>' : ''}
        <span class="day-count">${games.length} ${games.length === 1 ? 'game' : 'games'}</span>
      </div>`;
      games.forEach(game => {
        const idx = visibleGames.push(game) - 1;
        const t = convertTime(game.time);
        const live = isGameLive(parseGameDate(game.date, game.time), game.sport);
        html += `<button class="game ${sportClass(game.sport)}" data-idx="${idx}">
          <div class="time"><b>${esc(t.t)}</b><small>${esc(t.tz)}</small></div>
          <div>
            <div class="sport">${esc(game.sport)}</div>
            <div class="matchup">${esc(game.matchup)}${live ? '<span class="live">Live</span>' : ''}</div>
          </div>
          <span class="net ${getChannelClass(game.network)}">${esc(game.network)}</span>
        </button>`;
      });
      html += '</section>';
    });
  }
  document.getElementById('schedule').innerHTML = html;
}

document.getElementById('schedule').addEventListener('click', e => {
  const el = e.target.closest('.game');
  if (el) showDetailView(visibleGames[+el.dataset.idx]);
});

/* ---------- Detail ---------- */
function showDetailView(game) {
  track('view_game_details', { sport: game.sport, matchup: game.matchup, network: game.network, date: game.date });

  const ds = document.getElementById('detailSport');
  ds.textContent = game.sport;
  ds.parentElement.parentElement.className = 'detail-card ' + sportClass(game.sport);
  document.getElementById('detailTitle').textContent = game.matchup;
  document.getElementById('detailDate').textContent = game.date;
  document.getElementById('detailTime').textContent = game.time + ' EST';
  const net = document.getElementById('detailNetwork');
  net.textContent = game.network;
  net.className = 'net ' + getChannelClass(game.network);

  const info = document.getElementById('detailInfo');
  const extra = game.additionalInfo || game.bowlName || '';
  if (extra.trim()) {
    info.className = 'detail-info';
    info.innerHTML = formatAdditionalInfo(extra);
  } else {
    info.className = 'detail-info none';
    info.textContent = 'No additional details for this event.';
  }
  document.getElementById('detailView').classList.add('open');
  document.body.style.overflow = 'hidden';
}

// "🥊 Link Text\nhttps://url" -> clickable link. Input is escaped first.
function formatAdditionalInfo(text) {
  return esc(text)
    .replace(/🥊\s+([^\n]+)\n(https?:\/\/[^\s]+)/g,
      (m, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`)
    .replace(/\n/g, '<br>');
}

function closeDetailView() {
  const dv = document.getElementById('detailView');
  if (!dv.classList.contains('open')) return;
  track('close_game_details');
  dv.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('detailView').addEventListener('click', e => {
  if (e.target.id === 'detailView') closeDetailView();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetailView(); });

/* ---------- Init ---------- */
try {
  const tz = localStorage.getItem('selectedTimezone');
  if (tz && timezoneOffsets[tz] !== undefined) {
    currentTimezone = tz;
    document.getElementById('timezoneSelect').value = tz;
  }
} catch (e) {}

(function showToday() {
  const d = new Date();
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('currentDate').textContent = `${days[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
})();

window.addEventListener('load', loadScheduleData);
setInterval(loadScheduleData, 300000);
</script>
